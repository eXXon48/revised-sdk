<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, initial-scale=1">
<title>Revised Store UI mock</title>
<style>
  /* Presto/Opera-2.12-safe: literal colors (no CSS vars), no flex/gap,
     table + absolute layout, -o-transform. Also renders in Chromium. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#000;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;}
  .dev{position:relative;width:800px;height:480px;overflow:hidden;background:#0a0a0a;color:#fff;}

  /* slim on-brand scrollbar: applies in Chromium preview only.
     Presto shows its native bar (the on-unit overlay uses finger-drag, not this). */
  .list::-webkit-scrollbar,.pane::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-button,.pane::-webkit-scrollbar-button{display:none;width:0;height:0;}
  .list::-webkit-scrollbar-track,.pane::-webkit-scrollbar-track{background:transparent;}
  .list::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb{background:#2d2d2d;border-radius:3px;}
  .list::-webkit-scrollbar-thumb:active,.pane::-webkit-scrollbar-thumb:active{background:#E11218;}
  .list,.pane{scrollbar-width:thin;scrollbar-color:#2d2d2d transparent;}

  /* icon system: Iconsax Bold (svgrepo, MIT), fill=currentColor */
  .i{display:block;fill:currentColor;}

  /* ---- header 48px ---- */
  .hdr{position:absolute;left:0;top:0;right:0;height:48px;background:#000;
       border-bottom:1px solid #1c1c1c;z-index:30;}
  .hdr .burger{position:absolute;left:0;top:0;width:52px;height:48px;cursor:pointer;color:#fff;}
  .hdr .burger .i{position:absolute;left:13px;top:11px;width:26px;height:26px;}
  .hdr .title{position:absolute;left:52px;top:0;line-height:48px;font-size:21px;}
  .hdr .back{position:absolute;right:0;top:0;width:56px;height:48px;cursor:pointer;color:#fff;}
  .hdr .back .i{position:absolute;right:16px;top:12px;width:24px;height:24px;}
  .hdr .back:active{background:#151515;}

  /* ---- content ---- */
  .body{position:absolute;left:0;right:0;top:48px;bottom:0;overflow:hidden;}

  /* list fills the view above the bottom tab strip */
  .list{position:absolute;left:0;right:0;top:0;bottom:49px;overflow:auto;padding:12px 16px 16px;}
  .pane{position:absolute;left:0;right:0;top:0;bottom:0;overflow:auto;padding:44px 24px;}
  .pane h1{font-size:26px;margin:0 0 10px;}
  .pane p{color:#8a8a8a;font-size:15px;margin:0;line-height:1.5;}
  .empty{padding:48px 16px;text-align:center;color:#8a8a8a;font-size:15px;}

  /* full-width tab strip pinned to the BOTTOM of the view (table = equal widths, no flex) */
  .tabs{position:absolute;left:0;right:0;bottom:0;height:49px;display:table;table-layout:fixed;
        width:100%;background:#0c0c0c;border-top:1px solid #1c1c1c;}
  .tabs .tab{display:table-cell;vertical-align:middle;text-align:center;font-size:15px;color:#8a8a8a;
        cursor:pointer;text-transform:capitalize;}
  .tabs .tab.act{color:#fff;box-shadow:inset 0 2px 0 #E11218;}
  .tabs .tab:active{background:#161616;}

  /* store card (table row = no flex/gap) */
  .card{display:table;width:100%;margin:0 0 10px;padding:12px 14px;
        background:#141414;border:1px solid #1c1c1c;border-radius:6px;}
  .card .ico{display:table-cell;vertical-align:middle;width:56px;height:56px;border-radius:12px;
        text-align:center;background:#1e1e1e;border:1px solid #2a2a2a;color:#dcdcdc;}
  .card .ico .i{display:inline-block;vertical-align:middle;width:30px;height:30px;}
  .card .meta{display:table-cell;vertical-align:middle;width:100%;padding:0 12px 0 14px;}
  .card .nm{font-size:18px;margin:0 0 3px;}
  .card .sub{font-size:13px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn{display:table-cell;vertical-align:middle;white-space:nowrap;padding:9px 18px;border-radius:5px;
        font-size:14px;border:1px solid #E11218;color:#fff;background:#b60e13;cursor:pointer;}
  .btn.ghost{background:transparent;border-color:#444;color:#cfcfcf;}

  /* ---- drawer (absolute, no flex) ---- */
  .scrim{position:absolute;left:0;right:0;top:48px;bottom:0;background:rgba(0,0,0,.5);z-index:40;display:none;}
  .scrim.on{display:block;}
  .draw{position:absolute;left:0;top:48px;bottom:0;width:280px;background:#0d0d0d;
        border-right:1px solid #2a2a2a;z-index:50;display:none;}
  .draw.on{display:block;}
  .draw .item{position:relative;display:block;padding:16px 18px 16px 50px;font-size:18px;
        border-bottom:1px solid #141414;cursor:pointer;color:#e8e8e8;}
  .draw .item .i{position:absolute;left:18px;top:50%;margin-top:-11px;width:22px;height:22px;color:#9a9a9a;}
  .draw .item.act{background:#1a0708;border-left:4px solid #E11218;padding-left:46px;}
  .draw .item:active{background:#151515;}
  .draw .item.act .i{color:#fff;}
  .draw .exit{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 16px 48px;font-size:17px;
        color:#cfcfcf;border-top:1px solid #2a2a2a;cursor:pointer;background:#0d0d0d;}
  .draw .exit .i{position:absolute;left:18px;top:50%;margin-top:-10px;width:20px;height:20px;
        -o-transform:rotate(180deg);transform:rotate(180deg);color:#cfcfcf;}
  .draw .exit:active{background:#151515;}
</style>
</head>
<body>
<div class="dev">
  <!-- header -->
  <div class="hdr">
    <div class="burger" data-ic="menu" onclick="dr()"></div>
    <div class="title">Revised Store</div>
    <div class="back" data-ic="back" title="Back"></div>
  </div>

  <!-- content: rendered by JS per selected menu view -->
  <div class="body" id="view"></div>

  <!-- drawer -->
  <div class="scrim" id="scrim" onclick="dr(false)"></div>
  <div class="draw" id="draw">
    <div class="item" data-ic="home" onclick="pick(this)"><span class="lbl">Revised Home</span></div>
    <div class="item act" data-ic="category" onclick="pick(this)"><span class="lbl">Apps</span></div>
    <div class="item" data-ic="setting" onclick="pick(this)"><span class="lbl">System mods</span></div>
    <div class="item" data-ic="paint" onclick="pick(this)"><span class="lbl">Skins</span></div>
    <div class="item" data-ic="login" onclick="pick(this)"><span class="lbl">Login / logout</span></div>
    <div class="exit" data-ic="back" onclick="dr(false)"><span>Exit to Mazda home</span></div>
  </div>
</div>

  };
  function svg(name){ return '<svg class="i" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'+(ICONS[name]||'')+'</svg>'; }
  function paintIcons(){
    var els = document.querySelectorAll('[data-ic]');
    for(var i=0;i<els.length;i++){
      var name = els[i].getAttribute('data-ic');
      els[i].insertAdjacentHTML('afterbegin', svg(name));
    }
  }
  function dr(on){
    var d=document.getElementById('draw'), s=document.getElementById('scrim');
    if(on===undefined) on = !d.classList.contains('on');
    if(on){ d.classList.add('on'); s.classList.add('on'); }
    else  { d.classList.remove('on'); s.classList.remove('on'); }
  }

  /* ---- views + tabs ---- */
  var VIEWS = {
    'Revised Home':  { pane:'<h1>Revised Home</h1><p>Your apps, mods and skins in one place.<br>Pick a section from the menu.</p>' },
    'Apps':          { tabs:['Installed','Available','Featured'] },
    'System mods':   { tabs:['Installed','Available','Configuration'] },
    'Skins':         { tabs:['Installed','Available'] },
    'Login / logout':{ pane:'<h1>Account</h1><p>Sign in to sync your installs across resets.</p><button class="btn" style="margin-top:18px;display:inline-block">Log in</button>' }
  };
  var DATA = {
    'Apps':{
      Installed:[{ic:'monitor',nm:'Screen Tweaks',sub:'Display · v2.4',act:'Open',ghost:true}],
      Available:[
        {ic:'sound',nm:'EQ Unlock',sub:'Audio · v1.1 · 2.1 MB',act:'Install'},
        {ic:'map',nm:'Offline Maps+',sub:'Nav · v0.9 beta · 18 MB',act:'Install'},
        {ic:'code',nm:'Dev Console',sub:'Tools · v3.0 · 0.4 MB',act:'Install'},
        {ic:'speed',nm:'Boost Gauge',sub:'Dash · v1.5 · 1.2 MB',act:'Install'}
      ],
      Featured:[
        {ic:'speed',nm:'Boost Gauge',sub:'Editor pick · v1.5',act:'Install'},
        {ic:'map',nm:'Offline Maps+',sub:'Trending · v0.9 beta',act:'Install'}
      ]
    },
    'System mods':{
      Installed:[{ic:'setting',nm:'No-logo boot',sub:'Boot · active',act:'Remove',ghost:true}],
      Available:[
        {ic:'setting',nm:'Seatbelt chime off',sub:'CAN · v1.0',act:'Install'},
        {ic:'code',nm:'Dev menu unlock',sub:'Hidden · v1.2',act:'Install'}
      ],
      Configuration:[
        {ic:'setting',nm:'Auto-open overlay',sub:'on boot',act:'On',ghost:true},
        {ic:'setting',nm:'Log level',sub:'verbose',act:'Edit',ghost:true}
      ]
    },
    'Skins':{
      Installed:[{ic:'paint',nm:'Carbon Dark',sub:'active',act:'Applied',ghost:true}],
      Available:[
        {ic:'paint',nm:'Blue Night',sub:'theme · 0.3 MB',act:'Install'},
        {ic:'paint',nm:'Red Sport',sub:'theme · 0.4 MB',act:'Install'}
      ]
    }
  };

  var current='Apps', curTab='Installed';
  function cardHTML(c){
    return '<div class="card"><div class="ico">'+svg(c.ic)+'</div>'+
           '<div class="meta"><p class="nm">'+c.nm+'</p><div class="sub">'+c.sub+'</div></div>'+
           '<button class="btn'+(c.ghost?' ghost':'')+'">'+c.act+'</button></div>';
  }
  function render(){
    var v=VIEWS[current], h='';
    document.querySelector('.hdr .title').innerHTML=current;
    if(v.pane){ h='<div class="pane">'+v.pane+'</div>'; }
    else {
      var items=(DATA[current]&&DATA[current][curTab])||[];
      var cards='';
      if(items.length){ for(var i=0;i<items.length;i++) cards+=cardHTML(items[i]); }
      else cards='<div class="empty">Nothing here yet.</div>';
      h='<div class="list">'+cards+'</div>';
      var t='';
      for(var j=0;j<v.tabs.length;j++){
        var tab=v.tabs[j];
        t+='<div class="tab'+(tab===curTab?' act':'')+'" onclick="setTab(\''+tab+'\')">'+tab+'</div>';
      }
      h+='<div class="tabs">'+t+'</div>';
    }
    document.getElementById('view').innerHTML=h;
    var sc=document.querySelector('#view .list, #view .pane'); if(sc) sc.scrollTop=0;
  }
  function setTab(t){ curTab=t; render(); }
  function pick(el){
    var items=document.querySelectorAll('.draw .item');
    for(var i=0;i<items.length;i++) items[i].classList.remove('act');
    el.classList.add('act');
    current=el.getElementsByTagName('span')[0].innerHTML.replace(/^\s+|\s+$/g,'');
    var v=VIEWS[current];
    curTab=v.tabs?v.tabs[0]:null;
    render();
    dr(false);
  }

  paintIcons();
  render();
</script>
