<!doctype html>
<!-- Visual reference for the Pair screen (QR style "A3 tachometer", owner-approved 2026-11-14).
     PC-browser only: uses qrcode-generator from cdnjs for the matrix. On the unit the matrix
     comes from the daemon `pair.qr` rows (ECC H) and the animation runs on setTimeout. -->
<html><head><meta charset="utf-8"><title>Pair screen mockup</title></head>
<body style="background:#222;margin:20px">
<canvas id="s" width="800" height="480"></canvas>
<div><button id="rp">Replay startup</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var q=qrcode(0,'H');q.addData('https://cmu-revised.com/c_id/aB3dE9xQ');q.make();
var n=q.getModuleCount(),BG='#0C0C0C',cv=document.getElementById('s'),c=cv.getContext('2d');
var CX=220,CY=269,R=175,M=Math.ceil(n*1.42)+4;if((M-n)%2)M++;var s=2*R/M,off=(M-n)/2,ox=CX-R,oy=CY-R;
// note: arc() not arcTo() - Presto 12 arcTo draws garbage (butterflies/blobs)
function rr(x,y,w,h,r){var P=Math.PI;c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arc(x+w-r,y+r,r,-P/2,0,false);c.lineTo(x+w,y+h-r);c.arc(x+w-r,y+h-r,r,0,P/2,false);c.lineTo(x+r,y+h);c.arc(x+r,y+h-r,r,P/2,P,false);c.lineTo(x,y+r);c.arc(x+r,y+r,r,P,P*1.5,false);c.closePath();c.fill();}
function eye(r,cc){return (r<7&&cc<7)||(r<7&&cc>=n-7)||(r>=n-7&&cc<7);}
var L=Math.floor(n/2)-4,H=Math.floor(n/2)+4,seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
var cells=[];
for(var r=0;r<M;r++)for(var cc=0;cc<M;cc++){var x=ox+cc*s+s/2,y=oy+r*s+s/2,d=Math.sqrt((x-CX)*(x-CX)+(y-CY)*(y-CY));
 var qr=r-off,qc=cc-off,inQ=qr>=-2&&qc>=-2&&qr<n+2&&qc<n+2;
 if(inQ){if(qr<0||qc<0||qr>=n||qc>=n)continue;if(!q.isDark(qr,qc)||eye(qr,qc)||(qr>=L&&qr<=H&&qc>=L&&qc<=H))continue;cells.push([x,y,d,1]);}
 else if(d<R-s*0.6&&rnd()<0.45)cells.push([x,y,d,0]);}
var g=c.createLinearGradient(ox+off*s,oy+off*s,ox+(off+n)*s,oy+(off+n)*s);g.addColorStop(0,'#FF2A2A');g.addColorStop(1,'#9E0000');
var A0=Math.PI*0.75,SW=Math.PI*1.5;
function chrome(){
 c.fillStyle=BG;c.fillRect(0,0,800,480);
 c.fillStyle='#1C1C1C';c.fillRect(0,0,800,56);c.fillStyle='#E11218';c.fillRect(0,56,800,2);
 c.fillStyle='#CFCFCF';c.font='26px sans-serif';c.textAlign='left';c.textBaseline='middle';c.fillText('<',22,28);
 c.fillStyle='#FFFFFF';c.font='22px sans-serif';c.fillText('Revised Store - Account',56,28);
 c.fillStyle='#FFFFFF';c.font='bold 30px sans-serif';c.fillText('Link this car',440,130);
 c.fillStyle='#8A8A8A';c.font='18px sans-serif';c.fillText('Scan the code with your phone',440,172);c.fillText('or open this address:',440,198);
 c.fillStyle='#E0E0E0';c.font='18px sans-serif';c.fillText('cmu-revised.com/c_id/aB3dE9xQ',440,232);
 c.fillStyle='#2A2A2A';rr(440,262,300,64,10);c.fillStyle='#8A8A8A';c.font='14px sans-serif';c.fillText('Code',458,282);
 c.fillStyle='#FFFFFF';c.font='bold 30px monospace';c.fillText('aB3dE9xQ',458,309);
 c.fillStyle='#8A8A8A';c.font='16px sans-serif';c.fillText('Expires in 9:58',440,360);
 c.fillStyle='#5A5A5A';c.font='14px sans-serif';c.fillText('Back cancels',440,420);
}
function frame(p){
 chrome();var reach=p*(R*1.05);
 for(var i=0;i<cells.length;i++){var e=cells[i];if(e[2]>reach)continue;c.fillStyle=e[3]?g:'#3A0C0E';c.beginPath();c.arc(e[0],e[1],s*0.42,0,7);c.fill();}
 if(p>0.55){c.globalAlpha=Math.min(1,(p-0.55)/0.3);
  [[0,0],[0,n-7],[n-7,0]].forEach(function(pt){var x=ox+(off+pt[1])*s,y=oy+(off+pt[0])*s;
   c.fillStyle=g;rr(x,y,7*s,7*s,3.5*s);c.fillStyle=BG;rr(x+s,y+s,5*s,5*s,2.5*s);c.fillStyle=g;rr(x+2*s,y+2*s,3*s,3*s,1.5*s);});
  var bx=ox+(off+L+0.5)*s,by=oy+(off+L+0.5)*s,bw=(H-L)*s;c.strokeStyle='#E11218';c.lineWidth=bw*0.06;c.beginPath();c.arc(bx+bw/2,by+bw*0.62,bw*0.36,Math.PI*1.08,Math.PI*1.92);c.stroke();
  c.fillStyle='#FFFFFF';c.font='bold '+Math.round(bw*0.38)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('RE',bx+bw/2,by+bw*0.62);c.globalAlpha=1;c.textAlign='left';}
 c.lineCap='round';
 for(var t=0;t<=40;t++){var an=A0+SW*t/40,maj=t%5==0,r1=R+(maj?10:14),r2=R+24;
  c.strokeStyle=t>=32?'#E11218':(maj?'#CFCFCF':'#5A5A5A');c.lineWidth=maj?3:1.5;
  c.beginPath();c.moveTo(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1);c.lineTo(CX+Math.cos(an)*r2,CY+Math.sin(an)*r2);c.stroke();}
 c.strokeStyle='#E11218';c.lineWidth=4;c.beginPath();c.arc(CX,CY,R+28,A0+SW*0.8,A0+SW);c.stroke();
 var sw=p<0.5?p/0.5:1-(p-0.5)/0.5,na=A0+SW*Math.max(0,sw);
 c.strokeStyle='#FF2A2A';c.lineWidth=3;c.beginPath();c.moveTo(CX+Math.cos(na)*(R+4),CY+Math.sin(na)*(R+4));c.lineTo(CX+Math.cos(na)*(R+30),CY+Math.sin(na)*(R+30));c.stroke();
}
var t0=0;function run(){var p=Math.min(1,(Date.now()-t0)/1400);frame(p);if(p<1)setTimeout(run,33);}
function go(){t0=Date.now();run();}
document.getElementById('rp').onclick=go;go();
</script>
</body></html>
