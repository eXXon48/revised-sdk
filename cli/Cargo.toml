[package]
name = "revised-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "revised_sdk"
path = "src/lib.rs"

[[bin]]
name = "revised-sdk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rvp = { git = "https://github.com/eXXon48/cmu-re-store", rev = "f95d0d6f05642f95634571cdd76ac967004e67a1" }
serde_yaml = "0.9"
md-5 = "=0.11.0"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
diffy = "=0.5.2"

# Direct deps (versions + licenses):
#   serde 1 (MIT OR Apache-2.0), serde_json 1 (MIT OR Apache-2.0), sha2 0.10 (MIT OR Apache-2.0)
#   serde_yaml 0.9 (MIT OR Apache-2.0), md-5 0.11.0 (MIT OR Apache-2.0; digest 0.11 stack)
#   tungstenite =0.30.0 (MIT OR Apache-2.0; handshake only, vendored from cmu-re-store; WS client for push)
#   diffy =0.5.2 (MIT OR Apache-2.0; vendored from cmu-re-store, same version as the daemon so lint and install apply diffs alike; pulls in foldhash 0.2.0 (Zlib) via hashbrown)
#   rvp 0.1.0 (cmu-re-store @ f95d0d6, package format crate; PolyForm Shield 1.0.0)
