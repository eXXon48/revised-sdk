[package]
name = "revised-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "revised_sdk"
path = "src/lib.rs"

[[bin]]
name = "revised-sdk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rvp = { git = "https://github.com/eXXon48/cmu-re-store", rev = "866409f400ec70c2fed846adc36cda0e26add839" }
serde_yaml = "0.9"
md-5 = "=0.11.0"

# Direct deps (versions + licenses):
#   serde 1 (MIT OR Apache-2.0), serde_json 1 (MIT OR Apache-2.0), sha2 0.10 (MIT OR Apache-2.0)
#   serde_yaml 0.9 (MIT OR Apache-2.0), md-5 0.11.0 (MIT OR Apache-2.0; digest 0.11 stack)
#   rvp 0.1.0 (cmu-re-store @ 866409f, package format crate; PolyForm Shield 1.0.0)
